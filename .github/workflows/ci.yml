name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Install package without dependencies
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Security regression suite
        run: python -m unittest discover -s tests -v

  linux-sandbox-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version

      - name: Install package without dependencies
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Unprivileged sandbox must enforce or fail closed
        run: python -m unittest discover -s tests -p 'test_sandbox_integration.py' -v

      - name: Privileged CI probe must exercise real bubblewrap isolation
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo env "PATH=$PATH" GPTHANDS_BWRAP_STRICT=1 "$PYTHON_BIN" -m unittest discover -s tests -p 'test_sandbox_integration.py' -v

  macos-sandbox-integration:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Require sandbox-exec backend
        run: test -x /usr/bin/sandbox-exec

      - name: Install package without dependencies
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Real macOS sandbox isolation tests
        run: python -m unittest discover -s tests -p 'test_macos_sandbox_integration.py' -v
