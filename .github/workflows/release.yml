name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install pinned release toolchain
        run: |
          python -m pip install --disable-pip-version-check \
            'build==1.5.0' 'setuptools==84.0.0' 'wheel==0.48.0'

      - name: Require tag to match package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'tag/version mismatch: expected {expected}, got {actual}')
          print(f'verified release tag {actual}')
          PY

      - name: Reproducible release build
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export PYTHONHASHSEED=0
          rm -rf build dist dist-a dist-b src/*.egg-info
          python -m build --wheel --no-isolation --outdir dist-a
          rm -rf build src/*.egg-info
          python -m build --wheel --no-isolation --outdir dist-b
          python scripts/compare_artifacts.py dist-a dist-b
          mkdir -p dist
          cp dist-a/* dist/
          python scripts/generate_sbom.py --output dist/gpthands.cdx.json
          python scripts/checksums.py dist/*.whl dist/gpthands.cdx.json --output dist/SHA256SUMS

      - name: Attest build provenance with GitHub/Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl"

      - name: Attest CycloneDX SBOM with GitHub/Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl"
          sbom-path: "dist/gpthands.cdx.json"

      - name: Upload signed release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpthands-release-artifacts
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release from verified tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "GPTHands $GITHUB_REF_NAME"
